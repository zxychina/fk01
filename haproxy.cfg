global
  daemon
  log stdout format raw local0

defaults
  timeout connect 5000ms
  timeout client 600s
  timeout server 600s
  timeout check 5000ms
  log global
  mode http
  option redispatch

frontend main
  bind *:7080
  mode http

  # WebSocket 协议升级
  http-request set-header Upgrade http-request.hdr(Upgrade) if { method -i WS }
  http-request set-header Connection Upgrade if { method -i WS }

  # 路径分发
  acl is_vless  path_beg /vless
  acl is_vmess  path_beg /vmess
  acl is_trojan path_beg /trojan
  acl is_sub path_beg /subscribe.txt /clash.yaml
  acl is_nodes path_beg /nodes.txt /index.html

  # 订阅节点访问需携带正确 X-Key，否则返回 401
  acl sub_key_match req.hdr(X-Key) -i "${SUBSCRIBE_KEY}"

  use_backend sing_vless  if is_vless
  use_backend sing_vmess  if is_vmess
  use_backend sing_trojan if is_trojan
  use_backend nodes if is_nodes
  use_backend subscribe if is_sub
  default_backend subscribe

backend sing_vless
  mode http
  server vless 127.0.0.1:8080

backend sing_vmess
  mode http
  server vmess 127.0.0.1:8081

backend sing_trojan
  mode http
  server trojan 127.0.0.1:8082

backend subscribe
  mode http
  server sub 127.0.0.1:8088
  http-request deny deny_status 401 if !sub_key_match

backend nodes
  mode http
  server nodes 127.0.0.1:8088
  http-request deny deny_status 401 if !sub_key_match
