global
  daemon
  log stdout format raw local0

defaults
  timeout connect 5000ms
  timeout client 600s
  timeout server 600s
  timeout check 5000ms
  log global
  mode http
  option redispatch

frontend main
  bind *:7080
  mode http

  # 路径分发（WebSocket 由 HAProxy 自动隧道处理，无需手动改头）
  acl is_vless  path_beg /vless
  acl is_vmess  path_beg /vmess
  acl is_trojan path_beg /trojan

  # 订阅相关路径（含根路径与 index.html，这些含节点凭证，需保护）
  acl is_sub path_beg /subscribe.txt /clash.yaml /nodes.txt
  acl is_sub path / /index.html

#__AUTH_BLOCK__

  use_backend sing_vless  if is_vless
  use_backend sing_vmess  if is_vmess
  use_backend sing_trojan if is_trojan
  default_backend subscribe

backend sing_vless
  mode http
  server vless 127.0.0.1:8080

backend sing_vmess
  mode http
  server vmess 127.0.0.1:8081

backend sing_trojan
  mode http
  server trojan 127.0.0.1:8082

backend subscribe
  mode http
  server sub 127.0.0.1:8088
