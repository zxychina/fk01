global
  daemon
  log stdout format raw local0

defaults
  timeout connect 5000ms
  timeout client 600s
  timeout server 600s
  timeout check 5000ms
  log global
  mode http
  option redispatch

frontend main
  bind *:7080
  mode http

  # ========== 路径分发 ==========
  acl is_vless  path_beg /vless
  acl is_vmess  path_beg /vmess
  acl is_trojan path_beg /trojan

  # 订阅相关路径（无 key 前缀的原始路径）
  acl is_sub_raw path_beg /subscribe.txt /clash.yaml /nodes.txt
  acl is_sub_raw path / /index.html

  # 订阅路径前缀形式：/sub/<key>/...  ← 双轨认证之一（所有客户端通用）
  acl is_sub_path_prefix path_beg /sub/

__AUTH_BLOCK__

  use_backend sing_vless  if is_vless
  use_backend sing_vmess  if is_vmess
  use_backend sing_trojan if is_trojan
  default_backend subscribe

backend sing_vless
  mode http
  server vless 127.0.0.1:8080

backend sing_vmess
  mode http
  server vmess 127.0.0.1:8081

backend sing_trojan
  mode http
  server trojan 127.0.0.1:8082

backend subscribe
  mode http
  server sub 127.0.0.1:8088
